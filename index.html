<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jell & James Movie</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef5ee;
  color: #24352a;
  overflow-x: hidden;
}

button,
input {
  font: inherit;
}

/* =========================
   10 SECOND INTRO
========================= */

.intro {
  height: 64px;
  background: #dcebdc;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  border-bottom: 1px solid #c9dcc9;
  transition:
    height .5s ease,
    opacity .5s ease,
    padding .5s ease;
}

.intro.hidden {
  height: 0;
  opacity: 0;
  padding: 0;
  border: 0;
  overflow: hidden;
}

.logo {
  font-size: 20px;
  font-weight: 700;
}

.room-status {
  font-size: 13px;
  color: #55705b;
}

/* =========================
   MAIN
========================= */

.main {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 330px;
  gap: 14px;
  padding: 14px;
  max-width: 1500px;
  margin: auto;
}

.movie-section {
  min-width: 0;
}

.movie-card {
  background: #000;
  border-radius: 16px;
  overflow: hidden;
  aspect-ratio: 16 / 9;
  position: relative;
}

.movie-card iframe,
.movie-card video {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
}

.movie-placeholder {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #aaa;
  text-align: center;
  padding: 30px;
}

.movie-info {
  background: white;
  border-radius: 14px;
  margin-top: 12px;
  padding: 16px;
}

.movie-title {
  font-size: 21px;
  font-weight: 700;
}

.movie-input {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.movie-input input {
  flex: 1;
  border: 1px solid #ccd8cc;
  border-radius: 10px;
  padding: 11px;
  outline: none;
}

.primary {
  border: 0;
  background: #739b78;
  color: white;
  border-radius: 10px;
  padding: 11px 15px;
  cursor: pointer;
  font-weight: 600;
}

.primary:hover {
  background: #638a69;
}

/* =========================
   VIDEO CALL
========================= */

.side {
  background: white;
  border-radius: 16px;
  padding: 12px;
  min-height: 500px;
  display: flex;
  flex-direction: column;
}

.side-title {
  font-weight: 700;
  padding: 4px 4px 12px;
}

.video-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  max-height: 190px;
  overflow: hidden;
}

.video-tile {
  background: #18221b;
  border-radius: 12px;
  overflow: hidden;
  aspect-ratio: 16 / 10;
  max-height: 180px;
  position: relative;
}

.video-tile video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* MIRROR ONLY YOUR CAMERA */

#localVideo {
  transform: scaleX(-1);
}

.video-name {
  position: absolute;
  left: 8px;
  bottom: 7px;
  background: rgba(0,0,0,.6);
  color: white;
  padding: 4px 7px;
  border-radius: 6px;
  font-size: 12px;
}

.video-off {
  width: 100%;
  height: 100%;
  display: none;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: 700;
  background: #39483c;
}

/* =========================
   CONTROLS
========================= */

.controls {
  display: flex;
  justify-content: center;
  gap: 9px;
  padding-top: 12px;
  flex-wrap: wrap;
}

.control {
  width: 46px;
  height: 46px;
  border: 0;
  border-radius: 50%;
  background: #edf2ed;
  color: #26352a;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.control:hover {
  background: #dce8dc;
}

.control.off {
  background: #c96f6f;
  color: white;
}

.control.end {
  background: #bd5555;
  color: white;
  width: 58px;
  border-radius: 23px;
}

.icon {
  width: 21px;
  height: 21px;
}

/* =========================
   INVITE
========================= */

.invite-box {
  background: #f4f8f4;
  border-radius: 12px;
  padding: 12px;
  margin-top: 12px;
}

.invite-label {
  font-size: 12px;
  color: #647366;
  margin-bottom: 7px;
}

.invite-row {
  display: flex;
  gap: 7px;
}

.invite-row input {
  min-width: 0;
  flex: 1;
  border: 1px solid #ccd8cc;
  border-radius: 8px;
  padding: 9px;
  font-size: 12px;
}

.small-button {
  border: 0;
  border-radius: 8px;
  padding: 9px 10px;
  background: #739b78;
  color: white;
  cursor: pointer;
}

.status {
  font-size: 12px;
  color: #68756b;
  margin-top: 8px;
}

.people {
  margin-top: 12px;
  font-size: 13px;
  color: #617064;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 850px) {

  .main {
    grid-template-columns: 1fr;
  }

  .side {
    min-height: auto;
  }

}

@media (max-width: 500px) {

  .intro {
    padding: 0 10px;
  }

  .main {
    padding: 8px;
  }

  .movie-card {
    border-radius: 10px;
  }

  .side {
    border-radius: 12px;
  }

  .video-grid {
    max-height: 170px;
  }

  .video-tile {
    max-height: 160px;
  }

}
</style>
</head>

<body>

<!-- =========================
     TEMPORARY INTRO
========================= -->

<div
  class="intro"
  id="intro"
>

  <div class="logo">
    Jell & James Movie
  </div>

  <div
    class="room-status"
    id="roomStatus"
  >
    Connecting...
  </div>

</div>


<!-- =========================
     MAIN
========================= -->

<main class="main">

<section class="movie-section">

  <div
    class="movie-card"
    id="movieContainer"
  >

    <div class="movie-placeholder">
      Paste a movie/video URL below to start watching.
    </div>

  </div>


  <div class="movie-info">

    <div class="movie-title">
      Watch Together
    </div>

    <div class="movie-input">

      <input
        id="movieUrl"
        placeholder="Paste YouTube, Vimeo or video URL..."
      >

      <button
        class="primary"
        onclick="loadMovie()"
      >
        Play
      </button>

    </div>

  </div>

</section>


<!-- =========================
     VIDEO CALL
========================= -->

<aside class="side">

  <div class="side-title">
    Video Call
  </div>


  <div
    class="video-grid"
    id="videoGrid"
  >

    <!-- LOCAL VIDEO -->

    <div
      class="video-tile"
      id="localTile"
    >

      <video
        id="localVideo"
        autoplay
        muted
        playsinline
      ></video>

      <div
        class="video-off"
        id="localOff"
      >
        Camera Off
      </div>

      <div class="video-name">
        You
      </div>

    </div>

  </div>


  <!-- =========================
       CONTROLS
  ========================= -->

  <div class="controls">

    <!-- MICROPHONE -->

    <button
      class="control"
      id="micButton"
      title="Mute"
      onclick="toggleMic()"
    >

      <svg
        class="icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >

        <rect
          x="9"
          y="2"
          width="6"
          height="12"
          rx="3"
        />

        <path
          d="M5 10a7 7 0 0 0 14 0"
        />

        <path
          d="M12 17v5"
        />

        <path
          d="M8 22h8"
        />

      </svg>

    </button>


    <!-- CAMERA -->

    <button
      class="control"
      id="cameraButton"
      title="Turn camera off"
      onclick="toggleCamera()"
    >

      <svg
        class="icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >

        <path
          d="M15 10l4-3v10l-4-3"
        />

        <rect
          x="3"
          y="6"
          width="12"
          height="12"
          rx="2"
        />

      </svg>

    </button>


    <!-- LEAVE -->

    <button
      class="control end"
      title="Leave room"
      onclick="leaveRoom()"
    >

      <svg
        class="icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >

        <path
          d="M5 9c4-2 10-2 14 0"
        />

        <path
          d="M7 13l-2 3"
        />

        <path
          d="M17 13l2 3"
        />

      </svg>

    </button>

  </div>


  <!-- =========================
       INVITATION
  ========================= -->

  <div class="invite-box">

    <div class="invite-label">
      Room invitation
    </div>

    <div class="invite-row">

      <input
        id="inviteLink"
        readonly
      >

      <button
        class="small-button"
        onclick="copyInvite()"
      >
        Copy
      </button>

    </div>

    <div
      class="status"
      id="connectionStatus"
    >
      Starting room...
    </div>

  </div>


  <div
    class="people"
    id="peopleCount"
  >
    1 person in room
  </div>

</aside>

</main>


<script>

/*
==================================================
 IMPORTANT
==================================================

PALITAN ITO NG ACTUAL WSS ADDRESS
NG IYONG SIGNALING SERVER.

HALIMBAWA:

wss://your-server.example

HINDI GAGANA ANG VIDEO CALL HANGGA'T
HINDI ITO TOTOONG SERVER ADDRESS.
==================================================
*/

const SIGNALING_SERVER =
  "wss://YOUR-SIGNALING-SERVER.example";


/* =========================
   VARIABLES
========================= */

let ws = null;
let pc = null;
let localStream = null;

let roomId = null;
let isHost = false;
let connected = false;


const params =
  new URLSearchParams(
    window.location.search
  );


roomId =
  params.get("room");


/* =========================
   ROOM ID
========================= */

function generateRoomId() {

  return (
    "jell-" +
    Math.random()
      .toString(36)
      .substring(2, 10)
  );

}


/* =========================
   STATUS
========================= */

function setStatus(text) {

  document.getElementById(
    "connectionStatus"
  ).textContent = text;

  document.getElementById(
    "roomStatus"
  ).textContent = text;

}


/* =========================
   INVITE LINK
========================= */

function updateInvite() {

  const link =
    window.location.origin +
    window.location.pathname +
    "?room=" +
    encodeURIComponent(
      roomId
    );

  document.getElementById(
    "inviteLink"
  ).value = link;

}


/* =========================
   CAMERA + MICROPHONE
========================= */

async function startCamera() {

  try {

    localStream =
      await navigator.mediaDevices
        .getUserMedia({

          video: true,

          audio: true

        });


    document.getElementById(
      "localVideo"
    ).srcObject =
      localStream;


    setStatus(
      "Camera and microphone ready"
    );

  }

  catch (error) {

    console.error(
      error
    );

    setStatus(
      "Camera/microphone permission required"
    );

  }

}


/* =========================
   WEBRTC
========================= */

function createPeerConnection() {

  if (pc) {
    return;
  }


  pc =
    new RTCPeerConnection({

      iceServers: [

        {
          urls:
            "stun:stun.l.google.com:19302"
        },

        {
          urls:
            "stun:stun1.l.google.com:19302"
        }

      ]

    });


  if (localStream) {

    localStream
      .getTracks()
      .forEach(
        track => {

          pc.addTrack(
            track,
            localStream
          );

        }
      );

  }


  pc.onicecandidate =
    event => {

      if (
        event.candidate &&
        ws &&
        ws.readyState ===
        WebSocket.OPEN
      ) {

        ws.send(
          JSON.stringify({

            type:
              "candidate",

            room:
              roomId,

            candidate:
              event.candidate

          })
        );

      }

    };


  pc.ontrack =
    event => {

      addGuestVideo(
        event.streams[0]
      );

    };


  pc.onconnectionstatechange =
    () => {

      if (
        pc.connectionState ===
        "connected"
      ) {

        connected = true;

        setStatus(
          "Connected"
        );

      }


      if (
        pc.connectionState ===
        "disconnected" ||
        pc.connectionState ===
        "failed" ||
        pc.connectionState ===
        "closed"
      ) {

        connected = false;

        removeGuestVideo();

        setStatus(
          "Guest disconnected"
        );

      }

    };

}


/* =========================
   SIGNALING SERVER
========================= */

function connectSignaling() {

  ws =
    new WebSocket(
      SIGNALING_SERVER
    );


  ws.onopen =
    () => {

      ws.send(
        JSON.stringify({

          type:
            "join",

          room:
            roomId

        })
      );


      setStatus(
        isHost
          ? "Room ready"
          : "Joining room..."
      );

    };


  ws.onmessage =
    async event => {

      let data;

      try {

        data =
          JSON.parse(
            event.data
          );

      }

      catch {

        return;

      }


      /* ROOM JOINED */

      if (
        data.type ===
        "joined"
      ) {

        if (
          data.hasOther
        ) {

          await createOffer();

        }

        return;

      }


      /* OTHER USER JOINED */

      if (
        data.type ===
        "peer-joined"
      ) {

        if (
          !pc
        ) {

          await createOffer();

        }

        return;

      }


      /* OFFER */

      if (
        data.type ===
        "offer"
      ) {

        await receiveOffer(
          data.offer
        );

        return;

      }


      /* ANSWER */

      if (
        data.type ===
        "answer"
      ) {

        if (!pc) {
          return;
        }


        await pc.setRemoteDescription(
          data.answer
        );


        setStatus(
          "Connected"
        );

        return;

      }


      /* ICE */

      if (
        data.type ===
        "candidate"
      ) {

        if (!pc) {
          return;
        }


        try {

          await pc.addIceCandidate(
            data.candidate
          );

        }

        catch (
          error
        ) {

          console.error(
            error
          );

        }

        return;

      }


      /* ROOM FULL */

      if (
        data.type ===
        "room-full"
      ) {

        setStatus(
          "Room is full"
        );

        return;

      }


      /* USER LEFT */

      if (
        data.type ===
        "peer-left"
      ) {

        removeGuestVideo();

        setStatus(
          "Waiting for guest..."
        );

      }

    };


  ws.onerror =
    () => {

      setStatus(
        "Unable to connect to room server"
      );

    };


  ws.onclose =
    () => {

      connected = false;

    };

}


/* =========================
   CREATE OFFER
========================= */

async function createOffer() {

  createPeerConnection();


  const offer =
    await pc.createOffer();


  await pc.setLocalDescription(
    offer
  );


  ws.send(
    JSON.stringify({

      type:
        "offer",

      room:
        roomId,

      offer:
        offer

    })
  );

}


/* =========================
   RECEIVE OFFER
========================= */

async function receiveOffer(
  offer
) {

  createPeerConnection();


  await pc.setRemoteDescription(
    offer
  );


  const answer =
    await pc.createAnswer();


  await pc.setLocalDescription(
    answer
  );


  ws.send(
    JSON.stringify({

      type:
        "answer",

      room:
        roomId,

      answer:
        answer

    })
  );

}


/* =========================
   GUEST VIDEO
========================= */

function addGuestVideo(
  stream
) {

  if (
    document.getElementById(
      "guestTile"
    )
  ) {

    const existing =
      document.querySelector(
        "#guestTile video"
      );

    if (
      existing &&
      existing.srcObject !==
      stream
    ) {

      existing.srcObject =
        stream;

    }

    return;

  }


  const grid =
    document.getElementById(
      "videoGrid"
    );


  /*
    LOCAL + ONE GUEST ONLY
  */

  if (
    grid.querySelectorAll(
      ".video-tile"
    ).length >= 2
  ) {

    return;

  }


  const tile =
    document.createElement(
      "div"
    );


  tile.className =
    "video-tile";

  tile.id =
    "guestTile";


  const video =
    document.createElement(
      "video"
    );


  video.autoplay =
    true;

  video.playsInline =
    true;

  video.srcObject =
    stream;


  const name =
    document.createElement(
      "div"
    );


  name.className =
    "video-name";

  name.textContent =
    "Guest";


  tile.appendChild(
    video
  );

  tile.appendChild(
    name
  );


  grid.appendChild(
    tile
  );


  document.getElementById(
    "peopleCount"
  ).textContent =
    "2 people in room";

}


/* =========================
   REMOVE GUEST
========================= */

function removeGuestVideo() {

  const guest =
    document.getElementById(
      "guestTile"
    );


  if (guest) {

    guest.remove();

  }


  document.getElementById(
    "peopleCount"
  ).textContent =
    "1 person in room";

}


/* =========================
   MIC
========================= */

function toggleMic() {

  if (!localStream) {
    return;
  }


  const tracks =
    localStream.getAudioTracks();


  if (!tracks.length) {
    return;
  }


  const enabled =
    tracks[0].enabled;


  tracks.forEach(
    track => {

      track.enabled =
        !enabled;

    }
  );


  document.getElementById(
    "micButton"
  ).classList.toggle(
    "off",
    enabled
  );


  document.getElementById(
    "micButton"
  ).title =
    enabled
      ? "Unmute"
      : "Mute";

}


/* =========================
   CAMERA
========================= */

function toggleCamera() {

  if (!localStream) {
    return;
  }


  const tracks =
    localStream.getVideoTracks();


  if (!tracks.length) {
    return;
  }


  const enabled =
    tracks[0].enabled;


  tracks.forEach(
    track => {

      track.enabled =
        !enabled;

    }
  );


  document.getElementById(
    "cameraButton"
  ).classList.toggle(
    "off",
    enabled
  );


  document.getElementById(
    "cameraButton"
  ).title =
    enabled
      ? "Turn camera on"
      : "Turn camera off";


  document.getElementById(
    "localOff"
  ).style.display =
    enabled
      ? "flex"
      : "none";

}


/* =========================
   COPY INVITE
========================= */

async function copyInvite() {

  const input =
    document.getElementById(
      "inviteLink"
    );


  try {

    await navigator.clipboard.writeText(
      input.value
    );

    setStatus(
      "Invitation link copied"
    );

  }

  catch {

    input.select();

    document.execCommand(
      "copy"
    );

    setStatus(
      "Invitation link copied"
    );

  }

}


/* =========================
   LEAVE ROOM
========================= */

function leaveRoom() {

  if (ws) {

    try {
      ws.close();
    }

    catch {}

  }


  if (pc) {

    try {
      pc.close();
    }

    catch {}

  }


  if (localStream) {

    localStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }


  window.location.href =
    window.location.pathname;

}


/* =========================
   MOVIE
========================= */

function loadMovie() {

  const url =
    document.getElementById(
      "movieUrl"
    ).value.trim();


  if (!url) {
    return;
  }


  const container =
    document.getElementById(
      "movieContainer"
    );


  /* YOUTUBE */

  const youtube =
    url.match(
      /(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&?/]+)/
    );


  if (youtube) {

    const iframe =
      document.createElement(
        "iframe"
      );


    iframe.src =
      "https://www.youtube.com/embed/" +
      youtube[1];


    iframe.allow =
      "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";


    iframe.allowFullscreen =
      true;


    container.innerHTML =
      "";


    container.appendChild(
      iframe
    );


    return;

  }


  /* VIMEO */

  const vimeo =
    url.match(
      /vimeo\.com\/(\d+)/
    );


  if (vimeo) {

    const iframe =
      document.createElement(
        "iframe"
      );


    iframe.src =
      "https://player.vimeo.com/video/" +
      vimeo[1];


    iframe.allow =
      "autoplay; fullscreen; picture-in-picture";


    iframe.allowFullscreen =
      true;


    container.innerHTML =
      "";


    container.appendChild(
      iframe
    );


    return;

  }


  /* DIRECT VIDEO */

  const video =
    document.createElement(
      "video"
    );


  video.src =
    url;

  video.controls =
    true;

  video.playsInline =
    true;


  container.innerHTML =
    "";


  container.appendChild(
    video
  );

}


/* =========================
   INITIALIZE
========================= */

async function initialize() {

  if (
    !window.isSecureContext ||
    !navigator.mediaDevices
  ) {

    setStatus(
      "Camera requires HTTPS"
    );

    return;

  }


  if (!roomId) {

    roomId =
      generateRoomId();

    isHost =
      true;


    history.replaceState(
      {},
      "",
      window.location.pathname +
      "?room=" +
      encodeURIComponent(
        roomId
      )
    );

  }


  updateInvite();


  try {

    await startCamera();

  }

  catch {

    return;

  }


  connectSignaling();

}


/* =========================
   10 SECOND INTRO
========================= */

setTimeout(
  () => {

    document.getElementById(
      "intro"
    ).classList.add(
      "hidden"
    );

  },
  10000
);


/* START */

initialize();

</script>

</body>
</html>
