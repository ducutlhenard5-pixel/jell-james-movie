<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jell & James Movie</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef5ee;
  color: #24352a;
  overflow-x: hidden;
}

button,
input {
  font: inherit;
}

.header {
  height: 64px;
  background: #dcebdc;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  border-bottom: 1px solid #c9dcc9;
  position: sticky;
  top: 0;
  z-index: 20;
}

.logo {
  font-size: 20px;
  font-weight: 700;
}

.room-status {
  font-size: 13px;
  color: #55705b;
}

.main {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 330px;
  gap: 14px;
  padding: 14px;
  max-width: 1500px;
  margin: auto;
}

.movie-section {
  min-width: 0;
}

.movie-card {
  background: #000;
  border-radius: 16px;
  overflow: hidden;
  aspect-ratio: 16 / 9;
  position: relative;
}

.movie-card iframe,
.movie-card video {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
}

.movie-placeholder {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #aaa;
  text-align: center;
  padding: 30px;
}

.movie-info {
  background: white;
  border-radius: 14px;
  margin-top: 12px;
  padding: 16px;
}

.movie-title {
  font-size: 21px;
  font-weight: 700;
}

.movie-input {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.movie-input input {
  flex: 1;
  border: 1px solid #ccd8cc;
  border-radius: 10px;
  padding: 11px;
  outline: none;
}

.primary {
  border: 0;
  background: #739b78;
  color: white;
  border-radius: 10px;
  padding: 11px 15px;
  cursor: pointer;
  font-weight: 600;
}

.primary:hover {
  background: #638a69;
}

.side {
  background: white;
  border-radius: 16px;
  padding: 12px;
  min-height: 500px;
  display: flex;
  flex-direction: column;
}

.side-title {
  font-weight: 700;
  padding: 4px 4px 12px;
}

.video-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  flex: 1;
  align-content: start;
}

.video-tile {
  background: #18221b;
  border-radius: 12px;
  overflow: hidden;
  aspect-ratio: 16 / 10;
  position: relative;
}

.video-tile video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.video-name {
  position: absolute;
  left: 8px;
  bottom: 7px;
  background: rgba(0,0,0,.6);
  color: white;
  padding: 4px 7px;
  border-radius: 6px;
  font-size: 12px;
}

.video-off {
  width: 100%;
  height: 100%;
  display: none;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: 700;
  background: #39483c;
}

.controls {
  display: flex;
  justify-content: center;
  gap: 9px;
  padding-top: 12px;
  flex-wrap: wrap;
}

.control {
  width: 46px;
  height: 46px;
  border: 0;
  border-radius: 50%;
  background: #edf2ed;
  color: #26352a;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.control:hover {
  background: #dce8dc;
}

.control.off {
  background: #c96f6f;
  color: white;
}

.control.end {
  background: #bd5555;
  color: white;
  width: 58px;
  border-radius: 23px;
}

.icon {
  width: 21px;
  height: 21px;
}

.invite-box {
  background: #f4f8f4;
  border-radius: 12px;
  padding: 12px;
  margin-top: 12px;
}

.invite-label {
  font-size: 12px;
  color: #647366;
  margin-bottom: 7px;
}

.invite-row {
  display: flex;
  gap: 7px;
}

.invite-row input {
  min-width: 0;
  flex: 1;
  border: 1px solid #ccd8cc;
  border-radius: 8px;
  padding: 9px;
  font-size: 12px;
}

.small-button {
  border: 0;
  border-radius: 8px;
  padding: 9px 10px;
  background: #739b78;
  color: white;
  cursor: pointer;
}

.people {
  margin-top: 12px;
  font-size: 13px;
  color: #617064;
}

.join-box {
  padding: 30px 14px;
  text-align: center;
}

.join-box input {
  width: 100%;
  padding: 11px;
  border: 1px solid #ccd8cc;
  border-radius: 10px;
  margin: 8px 0;
}

.status {
  font-size: 12px;
  color: #68756b;
  margin-top: 8px;
}

@media (max-width: 850px) {
  .main {
    grid-template-columns: 1fr;
  }

  .side {
    min-height: 420px;
  }
}

@media (max-width: 500px) {
  .header {
    padding: 0 10px;
  }

  .main {
    padding: 8px;
  }

  .movie-card {
    border-radius: 10px;
  }

  .side {
    border-radius: 12px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">Jell & James Movie</div>
  <div class="room-status" id="roomStatus">Connecting...</div>
</header>

<main class="main">

  <section class="movie-section">

    <div class="movie-card" id="movieContainer">
      <div class="movie-placeholder">
        Paste a movie/video URL below to start watching.
      </div>
    </div>

    <div class="movie-info">
      <div class="movie-title">Watch Together</div>

      <div class="movie-input">
        <input
          id="movieUrl"
          placeholder="Paste YouTube, Vimeo or video URL..."
        >
        <button class="primary" onclick="loadMovie()">Play</button>
      </div>
    </div>

  </section>

  <aside class="side">

    <div class="side-title">Video Call</div>

    <div class="video-grid" id="videoGrid">

      <div class="video-tile" id="localTile">
        <video id="localVideo" autoplay muted playsinline></video>
        <div class="video-off" id="localOff">Camera Off</div>
        <div class="video-name">You</div>
      </div>

    </div>

    <div class="controls">

      <button
        class="control"
        id="micButton"
        title="Mute"
        onclick="toggleMic()"
      >
        <svg class="icon" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2">
          <rect x="9" y="2" width="6" height="12" rx="3"/>
          <path d="M5 10a7 7 0 0 0 14 0"/>
          <path d="M12 17v5"/>
          <path d="M8 22h8"/>
        </svg>
      </button>

      <button
        class="control"
        id="cameraButton"
        title="Turn camera off"
        onclick="toggleCamera()"
      >
        <svg class="icon" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2">
          <path d="M15 10l4-3v10l-4-3"/>
          <rect x="3" y="6" width="12" height="12" rx="2"/>
        </svg>
      </button>

      <button
        class="control end"
        title="Leave room"
        onclick="leaveRoom()"
      >
        <svg class="icon" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2">
          <path d="M5 9c4-2 10-2 14 0"/>
          <path d="M7 13l-2 3"/>
          <path d="M17 13l2 3"/>
        </svg>
      </button>

    </div>

    <div class="invite-box">
      <div class="invite-label">Room invitation</div>

      <div class="invite-row">
        <input id="inviteLink" readonly>
        <button class="small-button" onclick="copyInvite()">
          Copy
        </button>
      </div>

      <div class="status" id="connectionStatus">
        Starting room...
      </div>
    </div>

    <div class="people" id="peopleCount">
      1 person in room
    </div>

  </aside>

</main>

<script>
let peer = null;
let localStream = null;
let roomId = null;
let connections = new Map();

const params = new URLSearchParams(window.location.search);
roomId = params.get("room");

function generateRoomId() {
  return "jell-" + Math.random().toString(36).substring(2, 10);
}

function updateInvite() {
  const link = window.location.origin +
    window.location.pathname +
    "?room=" +
    encodeURIComponent(roomId);

  document.getElementById("inviteLink").value = link;
}

function setStatus(text) {
  document.getElementById("connectionStatus").textContent = text;
  document.getElementById("roomStatus").textContent = text;
}

async function startCamera() {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: true
    });

    document.getElementById("localVideo").srcObject = localStream;

    setStatus("Camera and microphone ready");
  } catch (error) {
    console.error(error);

    setStatus(
      "Camera/microphone permission is required"
    );
  }
}

function createPeer() {

  /*
    If there is already a room ID in the URL,
    connect to that room.

    If there isn't one, this user creates
    a new room.
  */

  if (!roomId) {
    roomId = generateRoomId();

    history.replaceState(
      {},
      "",
      window.location.pathname +
      "?room=" +
      encodeURIComponent(roomId)
    );
  }

  updateInvite();

  peer = new Peer(roomId);

  peer.on("open", () => {
    setStatus("Room ready");
  });

  peer.on("error", error => {

    console.error(error);

    /*
      If another user already owns the room,
      create a temporary peer and join it.
    */

    if (error.type === "unavailable-id") {
      joinExistingRoom();
    } else {
      setStatus("Connection error");
    }
  });

  peer.on("call", call => {

    if (!localStream) {
      return;
    }

    call.answer(localStream);

    setupCall(call);
  });
}

function joinExistingRoom() {

  const newPeer = new Peer();

  peer = newPeer;

  newPeer.on("open", id => {

    setStatus("Joining room...");

    const call = newPeer.call(
      roomId,
      localStream
    );

    setupCall(call);
  });

  newPeer.on("call", call => {

    call.answer(localStream);

    setupCall(call);
  });
}

function setupCall(call) {

  call.on("stream", remoteStream => {

    addRemoteVideo(
      call.peer,
      remoteStream
    );

    connections.set(
      call.peer,
      call
    );

    updatePeopleCount();
  });

  call.on("close", () => {

    removeRemoteVideo(call.peer);

    connections.delete(call.peer);

    updatePeopleCount();
  });

  call.on("error", error => {
    console.error(error);
  });
}

function addRemoteVideo(id, stream) {

  if (document.getElementById("tile-" + id)) {
    return;
  }

  const tile = document.createElement("div");

  tile.className = "video-tile";
  tile.id = "tile-" + id;

  const video = document.createElement("video");

  video.autoplay = true;
  video.playsInline = true;
  video.srcObject = stream;

  const name = document.createElement("div");

  name.className = "video-name";
  name.textContent = "Guest";

  tile.appendChild(video);
  tile.appendChild(name);

  document.getElementById("videoGrid").appendChild(tile);
}

function removeRemoteVideo(id) {

  const tile = document.getElementById(
    "tile-" + id
  );

  if (tile) {
    tile.remove();
  }
}

function connectToRoom() {

  if (!peer || !localStream) {
    return;
  }

  if (peer.id === roomId) {
    return;
  }

  const call = peer.call(
    roomId,
    localStream
  );

  if (call) {
    setupCall(call);
  }
}

function toggleMic() {

  if (!localStream) {
    return;
  }

  const tracks = localStream.getAudioTracks();

  if (!tracks.length) {
    return;
  }

  const enabled = tracks[0].enabled;

  tracks.forEach(track => {
    track.enabled = !enabled;
  });

  const button = document.getElementById("micButton");

  if (enabled) {
    button.classList.add("off");
    button.title = "Unmute";
  } else {
    button.classList.remove("off");
    button.title = "Mute";
  }
}

function toggleCamera() {

  if (!localStream) {
    return;
  }

  const tracks = localStream.getVideoTracks();

  if (!tracks.length) {
    return;
  }

  const enabled = tracks[0].enabled;

  tracks.forEach(track => {
    track.enabled = !enabled;
  });

  const button = document.getElementById(
    "cameraButton"
  );

  const off = document.getElementById(
    "localOff"
  );

  if (enabled) {

    button.classList.add("off");
    button.title = "Turn camera on";

    off.style.display = "flex";

  } else {

    button.classList.remove("off");
    button.title = "Turn camera off";

    off.style.display = "none";
  }
}

async function copyInvite() {

  const input = document.getElementById(
    "inviteLink"
  );

  try {

    await navigator.clipboard.writeText(
      input.value
    );

    setStatus("Invitation link copied");

  } catch {

    input.select();

    document.execCommand("copy");

    setStatus("Invitation link copied");
  }
}

function updatePeopleCount() {

  const count =
    document.querySelectorAll(".video-tile").length;

  document.getElementById(
    "peopleCount"
  ).textContent =
    count +
    (count === 1
      ? " person in room"
      : " people in room");
}

function leaveRoom() {

  if (localStream) {

    localStream.getTracks().forEach(
      track => track.stop()
    );
  }

  connections.forEach(call => {
    try {
      call.close();
    } catch {}
  });

  if (peer) {
    try {
      peer.destroy();
    } catch {}
  }

  window.location.href =
    window.location.pathname;
}

function loadMovie() {

  const url =
    document.getElementById(
      "movieUrl"
    ).value.trim();

  if (!url) {
    return;
  }

  const container =
    document.getElementById(
      "movieContainer"
    );

  /*
    YouTube
  */

  const youtube =
    url.match(
      /(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&?/]+)/
    );

  if (youtube) {

    const iframe =
      document.createElement("iframe");

    iframe.src =
      "https://www.youtube.com/embed/" +
      youtube[1];

    iframe.allow =
      "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";

    iframe.allowFullscreen = true;

    container.innerHTML = "";

    container.appendChild(iframe);

    return;
  }

  /*
    Vimeo
  */

  const vimeo =
    url.match(
      /vimeo\.com\/(\d+)/
    );

  if (vimeo) {

    const iframe =
      document.createElement("iframe");

    iframe.src =
      "https://player.vimeo.com/video/" +
      vimeo[1];

    iframe.allow =
      "autoplay; fullscreen; picture-in-picture";

    iframe.allowFullscreen = true;

    container.innerHTML = "";

    container.appendChild(iframe);

    return;
  }

  /*
    Direct video URL
  */

  const video =
    document.createElement("video");

  video.src = url;

  video.controls = true;

  video.autoplay = false;

  video.playsInline = true;

  container.innerHTML = "";

  container.appendChild(video);
}

async function initialize() {

  /*
    HTTPS is required for camera/mic.
  */

  if (
    !window.isSecureContext ||
    !navigator.mediaDevices
  ) {

    setStatus(
      "Camera requires HTTPS"
    );

    return;
  }

  await startCamera();

  createPeer();

  setTimeout(() => {

    connectToRoom();

  }, 1500);

  updatePeopleCount();
}

initialize();
</script>

</body>
</html>
